<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ЖҮК ЭКСПРЕСС</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--ink:#0d1b2e;--ink2:#1b3150;--amber:#ffb81c;--bg:#f2f4f8;--card:#fff;--txt:#0d1b2e;--mut:#6b778a;--line:#e5e9f0;--ok:#12a150;--red:#d92d20;--blue:#1f5fe0;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Manrope,system-ui,sans-serif}
body{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.top{background:linear-gradient(170deg,var(--ink) 40%,var(--ink2));padding:calc(14px + env(safe-area-inset-top,0px)) 16px 64px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:14px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--amber);color:var(--ink);display:grid;place-items:center;font-weight:800}
.brand b{font-size:17px;display:block}.brand span{font-size:12px;opacity:.7}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs button{padding:12px;border-radius:14px;color:#cfd8e6;border:1.5px solid rgba(255,255,255,.18);font-weight:700}
.tabs button.on{background:#fff;color:var(--ink);border-color:#fff}
.search{margin:-44px 16px 0;background:var(--card);border-radius:var(--r);display:flex;align-items:center;gap:12px;padding:12px;box-shadow:0 8px 24px rgba(13,27,46,.14)}
.search .ic{width:46px;height:46px;border-radius:14px;background:var(--amber);display:grid;place-items:center;font-size:20px}
.search .t{flex:1;text-align:left}.search .t b{display:block}.search .t span{color:var(--mut);font-size:14px}
.search .f{border-left:1px solid var(--line);padding-left:12px;color:var(--mut);font-size:13px;text-align:center}
.head{display:flex;justify-content:space-between;align-items:center;padding:18px 18px 8px;font-weight:700}
.chip{background:var(--card);border-radius:10px;padding:8px 12px;font-size:14px;color:var(--blue);font-weight:700}
.list{padding:0 16px;display:grid;gap:12px}
.card{background:var(--card);border-radius:var(--r);padding:14px 14px 12px;text-align:left;width:100%;border-left:5px solid var(--amber)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pt{display:grid;gap:2px;margin:8px 0;position:relative;padding-left:22px}
.pt::before{content:"";position:absolute;left:6px;top:10px;bottom:10px;border-left:2px dotted #b8c1cf}
.pt i{position:absolute;left:0;width:14px;height:14px;border-radius:50%;border:3px solid var(--ink);background:#fff}
.pt i.b{background:var(--amber);border-color:var(--amber)}
.pt div{font-size:17px;font-weight:800;position:relative}.pt small{color:var(--mut);font-weight:500;font-size:13px}
.price{color:var(--blue);font-weight:800}.meta{display:flex;gap:14px;color:var(--mut);font-size:14px;border-top:1px solid var(--line);padding-top:9px;margin-top:6px}
.tag{font-size:12px;font-weight:700;padding:4px 9px;border-radius:8px;background:#fde8e6;color:var(--red)}.tag.g{background:#e3f6ec;color:var(--ok)}
.rate{color:#a86b00;font-weight:800}
.av{width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--amber);display:grid;place-items:center;font-weight:800;font-size:20px}
.nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));height:68px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-radius:26px;display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:center;box-shadow:0 8px 30px rgba(13,27,46,.2)}
.nav button{display:grid;gap:2px;justify-items:center;font-size:11px;font-weight:700;color:var(--mut)}.nav button.on{color:var(--blue)}.nav b{font-size:21px}
.ai{width:64px;height:64px;border-radius:50%;background:var(--amber);color:var(--ink);font-weight:800;font-size:18px;margin:-26px auto 0;box-shadow:0 8px 20px rgba(255,184,28,.55);border:4px solid var(--bg)!important}
.badge{position:absolute;margin:-6px 0 0 14px;background:var(--red);color:#fff;border-radius:9px;font-size:10px;padding:1px 5px}
.dim{position:fixed;inset:0;background:rgba(13,27,46,.5);display:none;z-index:20}.dim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));z-index:21;transform:translateY(105%);transition:transform .25s}
.sheet.on{transform:none}
.sheet h2{margin:0 0 12px;font-size:20px}
.in{width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;margin-bottom:10px}
.btn{width:100%;padding:15px;border-radius:14px;background:var(--amber);color:var(--ink);font-weight:800;margin-top:4px}
.btn.d{background:var(--ink);color:#fff}.btn.s{background:#fff;border:1.5px solid var(--line)}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.btns a{padding:13px 4px;border-radius:12px;color:#fff;text-align:center;font-weight:700;text-decoration:none;font-size:14px}
#map{height:210px;border-radius:16px;margin-bottom:10px}
.kv{background:#fff;border-radius:16px;padding:4px 14px}.kv div{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}.kv div:last-child{border:0}.kv span{color:var(--mut)}.kv b{text-align:right}
.msg{max-width:86%;padding:11px 14px;border-radius:16px;margin-bottom:8px;line-height:1.4}.me{background:var(--ink);color:#fff;margin-left:auto}.bot{background:#fff}
.empty{text-align:center;color:var(--mut);padding:40px 20px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div class="dim" id="dim"></div>
<div class="sheet" id="sheet" role="dialog"></div>

<script>
try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}

// ===== ДАННЫЕ (потом заменим на настоящую базу) =====
const CITY={'Бишкек':[42.8746,74.5698],'Ош':[40.5283,72.7985],'Джалал-Абад':[40.9333,72.9833],'Каракол':[42.4907,78.3936],'Алматы':[43.2389,76.8897],'Ташкент':[41.2995,69.2401],'Наманган':[40.9983,71.6726],'Москва':[55.7558,37.6173],'Новосибирск':[55.0084,82.9357],'Екатеринбург':[56.8389,60.6057]};
const CARGO=[
 {id:1,a:'Бишкек',b:'Наманган',t:25,body:'Тент',goods:'Текстиль',price:174958,ago:27,hot:1},
 {id:2,a:'Бишкек',b:'Каракол',t:20,body:'Тент',goods:'Стройматериалы',price:0,ago:120},
 {id:3,a:'Ош',b:'Москва',t:25,body:'Тент',goods:'ТНП',price:0,ago:200,hot:1},
 {id:4,a:'Ош',b:'Бишкек',t:28,body:'Реф',goods:'Продукты +6°C',price:0,ago:300},
 {id:5,a:'Алматы',b:'Бишкек',t:22,body:'Тент',goods:'Сборный груз',price:95000,ago:420}
];
const CARS=[
 {n:'Айбек',r:4.9,c:31,car:'Volvo FH',t:22,body:'Тент',city:'Бишкек',free:1},
 {n:'Нурлан',r:4.7,c:18,car:'Mercedes Actros',t:28,body:'Реф',city:'Ош',free:1},
 {n:'Руслан',r:4.5,c:9,car:'Sprinter',t:2,body:'Фургон',city:'Алматы',free:0}
];

// ===== СОСТОЯНИЕ =====
const S={view:'home',tab:'cargo',from:'',to:'',body:'',my:JSON.parse(localStorage.myCars||'[]'),watch:JSON.parse(localStorage.watch||'[]'),phone:localStorage.phone||''};
const $=s=>document.querySelector(s);
const ago=m=>m<60?m+' мин назад':Math.round(m/60)+' ч назад';
const km=(a,b)=>{const R=6371,r=x=>x*Math.PI/180,[p,q]=[CITY[a],CITY[b]];const d=Math.acos(Math.sin(r(p[0]))*Math.sin(r(q[0]))+Math.cos(r(p[0]))*Math.cos(r(q[0]))*Math.cos(r(q[1]-p[1])));return Math.round(R*d*1.3)};
const money=p=>p?p.toLocaleString('ru')+' сом':'Договорная';
const opts=(sel)=>'<option value="">Любой</option>'+Object.keys(CITY).map(c=>`<option ${c===sel?'selected':''}>${c}</option>`).join('');

function filtered(){return CARGO.filter(c=>(!S.from||c.a===S.from)&&(!S.to||c.b===S.to)&&(!S.body||c.body===S.body))}

// ===== ЭКРАНЫ =====
function render(){
 const v=S.view;let h='';
 if(v==='home'){
  const list=S.tab==='cargo'?filtered():CARS.filter(c=>(!S.from||c.city===S.from)&&(!S.body||c.body===S.body));
  h=`<div class="top"><div class="brand"><div class="logo">ЖЭ</div><div><b>ЖҮК ЭКСПРЕСС</b><span>Грузовая платформа СНГ</span></div></div>
  <div class="tabs"><button class="${S.tab==='cargo'?'on':''}" data-tab="cargo">Грузы</button><button class="${S.tab==='car'?'on':''}" data-tab="car">Транспорт</button></div></div>
  <button class="search" id="q" style="width:calc(100% - 32px)"><div class="ic">🔍</div><div class="t"><b>Поиск</b><span>${S.from||'Откуда'} → ${S.to||'Куда'}</span></div><div class="f">🚚<br>${S.body||'Все'}</div></button>
  <div class="head"><span>${S.tab==='cargo'?'Грузов':'Машин'}: ${list.length}</span><button class="chip" id="add">${S.tab==='cargo'?'+ Разместить груз':'+ Добавить транспорт'}</button></div><div class="list">`;
  h+=list.length?list.map((c,i)=>S.tab==='cargo'?cargoCard(c):carCard(c,i)).join(''):'<div class="empty">Ничего не найдено.<br>Измените маршрут или тип кузова.</div>';
  h+='</div>';
 }
 if(v==='garage'){h=page('Гараж','<div class="list">'+(S.my.length?S.my.map(c=>carCard(c)).join(''):'<div class="empty">В гараже пока пусто.<br>Добавьте машину, чтобы получать грузы.</div>')+'</div><div class="list" style="margin-top:12px"><button class="btn" id="add2">+ Добавить транспорт</button></div>')}
 if(v==='news'){h=page('Уведомления','<div class="list">'+(S.watch.length?S.watch.map(w=>`<div class="card"><b>ИИ следит за грузом</b><div style="margin-top:6px;color:var(--mut)">${w}</div></div>`).join(''):'<div class="empty">Здесь появятся уведомления.<br>Нажмите «ИИ» и опишите, какой груз ищете.</div>')+'</div>')}
 if(v==='me'){h=page('Профиль',`<div class="list"><div class="card"><b>Вход по номеру телефона</b><input class="in" id="ph" placeholder="+996 ___ ___ ___" value="${S.phone}" style="margin-top:10px"><button class="btn" id="save">Сохранить номер</button></div><a class="card" href="https://t.me/" style="text-decoration:none;color:inherit"><b>Техподдержка</b><div style="color:var(--mut);margin-top:4px">Написать в Telegram</div></a></div>`)}
 $('#app').innerHTML=h+nav();
}
const page=(t,b)=>`<div class="top" style="padding-bottom:22px"><div class="brand" style="margin:0"><div class="logo">ЖЭ</div><b style="font-size:20px">${t}</b></div></div><div style="height:14px"></div>${b}`;
const nav=()=>{const t=(k,i,l)=>`<button class="${S.view===k?'on':''}" data-v="${k}"><b>${i}</b>${l}</button>`;return `<nav class="nav">${t('home','⌂','Главная')}${t('garage','🚛','Гараж')}<button class="ai" id="ai">ИИ</button>${t('news','🔔','Новости')}${t('me','👤','Профиль')}</nav>`};
const cargoCard=c=>`<button class="card" data-c="${c.id}"><div class="row"><span>${c.hot?'<span class="tag">Срочно</span>':''}</span><span class="price">${money(c.price)}</span></div>
 <div class="pt"><i></i><div>${c.a}</div><i class="b" style="top:auto;bottom:4px"></i><div>${c.b}</div></div><div class="meta"><span>${km(c.a,c.b)} км</span><span>${c.t} т</span><span>${c.body}</span><span style="margin-left:auto">${ago(c.ago)}</span></div></button>`;
const carCard=c=>`<div class="card" style="border-left-color:var(--ok)"><div class="row" style="justify-content:flex-start;gap:14px"><div class="av">${c.n[0]}</div><div><b style="font-size:18px">${c.n}</b> ${c.free?'<span class="tag g">Свободен</span>':''}<div class="rate">★ ${c.r} <span style="color:var(--mut);font-weight:500">(${c.c})</span></div><div style="color:var(--mut);font-size:14px">${c.car} · ${c.t} т · ${c.body} · ${c.city}</div></div></div></div>`;

// ===== ШТОРКИ =====
function open(html){$('#sheet').innerHTML=html;$('#sheet').classList.add('on');$('#dim').classList.add('on')}
function close(){$('#sheet').classList.remove('on');$('#dim').classList.remove('on')}
$('#dim').onclick=close;

function searchSheet(){open(`<h2>Поиск</h2><select class="in" id="sf">${opts(S.from)}</select><select class="in" id="st">${opts(S.to)}</select>
 <select class="in" id="sb">${['','Тент','Реф','Фургон','Борт'].map(b=>`<option ${b===S.body?'selected':''} value="${b}">${b||'Любой кузов'}</option>`).join('')}</select><button class="btn" id="go">Показать</button><button class="btn s" id="clr">Сбросить</button>`);
 $('#go').onclick=()=>{S.from=$('#sf').value;S.to=$('#st').value;S.body=$('#sb').value;close();render()};
 $('#clr').onclick=()=>{S.from=S.to=S.body='';close();render()};
}
function addSheet(){
 if(S.tab==='cargo'&&S.view==='home'){
  open(`<h2>Разместить груз</h2><select class="in" id="a">${opts('')}</select><select class="in" id="b">${opts('')}</select><input class="in" id="g" placeholder="Груз (например, ТНП)"><input class="in" id="w" type="number" placeholder="Вес, т"><select class="in" id="bd"><option>Тент</option><option>Реф</option><option>Фургон</option><option>Борт</option></select><input class="in" id="p" type="number" placeholder="Цена, сом (пусто = договорная)"><button class="btn" id="ok">Опубликовать</button>`);
  $('#ok').onclick=()=>{const a=$('#a').value,b=$('#b').value;if(!a||!b)return alert('Выберите города');CARGO.unshift({id:Date.now(),a,b,t:+$('#w').value||1,body:$('#bd').value,goods:$('#g').value||'Груз',price:+$('#p').value||0,ago:0,hot:1});close();render()};
 }else{
  open(`<h2>Добавить транспорт</h2><input class="in" id="n" placeholder="Имя водителя"><input class="in" id="m" placeholder="Марка (Volvo FH)"><input class="in" id="w" type="number" placeholder="Грузоподъёмность, т"><select class="in" id="bd"><option>Тент</option><option>Реф</option><option>Фургон</option><option>Борт</option></select><select class="in" id="ct">${opts('Бишкек').replace('<option value="">Любой</option>','')}</select><button class="btn" id="ok">Сохранить</button>`);
  $('#ok').onclick=()=>{S.my.push({n:$('#n').value||'Я',r:5,c:0,car:$('#m').value||'Машина',t:+$('#w').value||1,body:$('#bd').value,city:$('#ct').value,free:1});localStorage.myCars=JSON.stringify(S.my);close();S.view='garage';render()};
 }
}
function detail(id){
 const c=CARGO.find(x=>x.id==id);if(!c)return;
 open(`<h2>${c.a} → ${c.b}</h2><div id="map"></div><p id="dist" style="font-weight:800;margin:0 0 10px">Расстояние: ~${km(c.a,c.b)} км</p>
 <div class="kv"><div><span>Груз</span><b>${c.goods}</b></div><div><span>Вес</span><b>${c.t} т</b></div><div><span>Кузов</span><b>${c.body}</b></div><div><span>Цена</span><b>${money(c.price)}</b></div></div>
 <div class="btns"><a style="background:var(--blue)" href="tel:+996000000000">Позвонить</a><a style="background:#229ed9" href="https://t.me/">Telegram</a><a style="background:#1ea952" href="https://wa.me/996000000000">WhatsApp</a></div>`);
 setTimeout(()=>{
  const A=CITY[c.a],B=CITY[c.b],m=L.map('map',{zoomControl:true}).fitBounds([A,B],{padding:[30,30]});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(m);
  L.marker(A).addTo(m);L.marker(B).addTo(m);
  const line=L.polyline([A,B],{color:'#1f5fe0',dashArray:'6 8'}).addTo(m);
  fetch(`https://router.project-osrm.org/route/v1/driving/${A[1]},${A[0]};${B[1]},${B[0]}?overview=simplified&geometries=geojson`).then(r=>r.json()).then(d=>{
   const r=d.routes[0];m.removeLayer(line);const p=L.geoJSON(r.geometry,{style:{color:'#1f5fe0',weight:5}}).addTo(m);m.fitBounds(p.getBounds(),{padding:[20,20]});
   $('#dist').textContent='Расстояние по дорогам: '+Math.round(r.distance/1000)+' км';
  }).catch(()=>{});
 },250);
}

// ===== ИИ-АССИСТЕНТ (вместо «Магнита») =====
// Сейчас: простой разбор текста на телефоне. Позже: заменить askAI() на запрос к настоящему ИИ через свой сервер.
function askAI(text){
 const t=text.toLowerCase(),found=Object.keys(CITY).filter(c=>t.includes(c.toLowerCase().slice(0,4))).sort((x,y)=>t.indexOf(x.toLowerCase().slice(0,4))-t.indexOf(y.toLowerCase().slice(0,4)));
 const body=t.includes('реф')?'Реф':t.includes('тент')?'Тент':t.includes('фург')?'Фургон':'';
 const w=(t.match(/(\d+)\s*т/)||[])[1];
 const res=CARGO.filter(c=>(!found[0]||c.a===found[0])&&(!found[1]||c.b===found[1])&&(!body||c.body===body)&&(!w||c.t>=+w));
 return{res,desc:`${found[0]||'Откуда угодно'} → ${found[1]||'куда угодно'}${body?', '+body:''}${w?', от '+w+' т':''}`};
}
function aiSheet(){
 open(`<h2>ИИ-ассистент</h2><div id="chat"><div class="msg bot">Опишите, какой груз ищете. Например: «Бишкек Ош тент 20 т». Я найду подходящие и сообщу, когда появятся новые.</div></div>
 <div style="display:flex;gap:8px"><input class="in" id="tx" placeholder="Напишите запрос" style="margin:0"><button class="btn" id="snd" style="width:auto;margin:0;padding:0 18px">→</button></div>`);
 const send=()=>{const v=$('#tx').value.trim();if(!v)return;$('#tx').value='';const r=askAI(v);
  $('#chat').insertAdjacentHTML('beforeend',`<div class="msg me">${v}</div>`);
  $('#chat').insertAdjacentHTML('beforeend',`<div class="msg bot">Нашёл грузов: ${r.res.length}.<br>${r.res.map(c=>`${c.a} → ${c.b}, ${c.t} т, ${c.body}`).join('<br>')}<br><button class="btn" style="margin-top:10px" data-w="${r.desc}">Сообщать о новых</button></div>`)};
 $('#snd').onclick=send;$('#tx').onkeydown=e=>e.key==='Enter'&&send();
}

// ===== СОБЫТИЯ =====
document.addEventListener('click',e=>{
 const b=e.target.closest('button,[data-c]');if(!b)return;
 if(b.dataset.tab){S.tab=b.dataset.tab;render()}
 else if(b.dataset.v){S.view=b.dataset.v;render()}
 else if(b.dataset.c)detail(b.dataset.c);
 else if(b.id==='q')searchSheet();
 else if(b.id==='add'||b.id==='add2')addSheet();
 else if(b.id==='ai')aiSheet();
 else if(b.id==='save'){S.phone=$('#ph').value;localStorage.phone=S.phone;b.textContent='Сохранено'}
 else if(b.dataset.w){S.watch.push(b.dataset.w);localStorage.watch=JSON.stringify(S.watch);b.textContent='Включено';b.disabled=true}
});
render();
</script>
</body>
</html>
