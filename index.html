<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ЖҮК ЭКСПРЕСС</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--sky:#0ea5e9;--sky2:#e0f4ff;--ink:#0b2540;--mut:#6b7f94;--line:#e3edf5;--bg:#f6fafd;--red:#e5383b;--ok:#13a463}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}
.hero{background:linear-gradient(180deg,var(--sky2),var(--bg));padding:calc(16px + env(safe-area-inset-top,0px)) 16px 8px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{width:40px;height:40px;border-radius:13px;background:var(--sky);color:#fff;display:grid;place-items:center;font-weight:800}
.brand b{display:block;font-size:17px}.brand span{font-size:12px;color:var(--mut)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#fff;border-radius:14px;padding:4px;border:1px solid var(--line)}
.tabs button{padding:11px;border-radius:11px;font-weight:700;color:var(--mut)}.tabs .on{background:var(--sky);color:#fff}
.box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;margin:12px 16px;box-shadow:0 6px 20px rgba(14,165,233,.08)}
.in{width:100%;padding:14px;border-radius:13px;border:1.5px solid var(--line);background:#fff;margin-bottom:10px;outline:none}.in:focus{border-color:var(--sky)}
.btn{width:100%;padding:15px;border-radius:14px;background:var(--sky);color:#fff;font-weight:800}.btn.o{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.head{display:flex;justify-content:space-between;align-items:center;padding:6px 18px;font-weight:700}
.chip{background:var(--sky2);color:var(--sky);border-radius:10px;padding:8px 12px;font-weight:800;font-size:14px}
.list{padding:0 16px;display:grid;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;width:100%}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.route{font-size:18px;font-weight:800;margin:8px 0}.route i{color:var(--sky);font-style:normal;margin:0 6px}
.price{color:var(--sky);font-weight:800}.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:14px;border-top:1px solid var(--line);padding-top:9px}
.tag{font-size:12px;font-weight:800;padding:4px 9px;border-radius:8px;background:#ffe5e6;color:var(--red)}.tag.b{background:var(--sky2);color:var(--sky)}
.av{width:56px;height:56px;border-radius:50%;background:var(--sky2);color:var(--sky);display:grid;place-items:center;font-weight:800;font-size:22px;overflow:hidden;flex:none}.av img{width:100%;height:100%;object-fit:cover}
.nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));height:66px;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:24px;display:grid;grid-template-columns:1fr 1fr 80px 1fr 1fr;align-items:center;box-shadow:0 8px 28px rgba(11,37,64,.14)}
.nav button{display:grid;justify-items:center;gap:1px;font-size:11px;font-weight:700;color:var(--mut)}.nav .on{color:var(--sky)}.nav b{font-size:20px}
.ai{width:60px;height:60px;border-radius:50%;background:var(--sky)!important;color:#fff!important;font-weight:800;font-size:17px!important;margin:-24px auto 0;border:4px solid var(--bg)!important;box-shadow:0 8px 18px rgba(14,165,233,.5)}
.dim{position:fixed;inset:0;background:rgba(11,37,64,.45);display:none;z-index:20}.dim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:90%;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));z-index:21;transform:translateY(105%);transition:transform .25s}.sheet.on{transform:none}
.sheet h2{margin:0 0 12px;font-size:20px}
#map{height:210px;border-radius:16px;margin-bottom:10px}
.kv{background:#fff;border:1px solid var(--line);border-radius:16px;padding:2px 14px}.kv div{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}.kv div:last-child{border:0}.kv span{color:var(--mut)}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.btns a,.btns button{padding:13px 2px;border-radius:12px;color:#fff;text-align:center;font-weight:700;text-decoration:none;font-size:13px}
.msg{max-width:84%;padding:10px 14px;border-radius:16px;margin-bottom:8px;line-height:1.4;background:#fff;border:1px solid var(--line)}.me{background:var(--sky);color:#fff;margin-left:auto;border:0}
.auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px}
.role{display:flex;align-items:center;gap:14px;padding:16px;margin-bottom:10px;border-radius:18px;background:#fff;border:1.5px solid var(--line);width:100%;text-align:left;font-weight:800;font-size:17px}.role small{display:block;color:var(--mut);font-weight:500;font-size:13px}.role.on{border-color:var(--sky);background:var(--sky2)}
.empty{text-align:center;color:var(--mut);padding:36px 20px}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
</style></head><body>
<div id="app"></div><div class="dim" id="dim"></div><div class="sheet" id="sheet"></div>
<script>
try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const J=(k,d)=>{try{return JSON.parse(localStorage[k])||d}catch(e){return d}},save=(k,v)=>{try{localStorage[k]=JSON.stringify(v)}catch(e){}};
const ROLES={driver:['🚛','Водитель','Ищу грузы, вожу по СНГ'],owner:['📦','Грузовладелец','Размещаю грузы'],dispatcher:['🧭','Диспетчер','Соединяю грузы и машины']};
const CITY={'бишкек':[42.8746,74.5698],'ош':[40.5283,72.7985],'джалал-абад':[40.9333,72.9833],'каракол':[42.4907,78.3936],'алматы':[43.2389,76.8897],'ташкент':[41.2995,69.2401],'наманган':[40.9983,71.6726],'москва':[55.7558,37.6173],'нукус':[42.4531,59.6103],'новосибирск':[55.0084,82.9357]};
let U=J('u',null),CHATS=J('chats',{}),CARGO=J('cargo',null)||[
 {id:1,a:'Бишкек',b:'Наманган',t:25,body:'Тент',goods:'Текстиль',price:174958,ago:27,hot:1},
 {id:2,a:'Бишкек',b:'Каракол',t:20,body:'Тент',goods:'Стройматериалы',price:0,ago:120},
 {id:3,a:'Ош',b:'Москва',t:25,body:'Тент',goods:'ТНП',price:0,ago:200,hot:1},
 {id:4,a:'Ош',b:'Бишкек',t:28,body:'Реф',goods:'Продукты +6°C',price:0,ago:300},
 {id:5,a:'Алматы',b:'Бишкек',t:22,body:'Тент',goods:'Сборный груз',price:95000,ago:420}];
const CARS=[{n:'Айбек',r:4.9,c:31,car:'Volvo FH',t:22,body:'Тент',city:'Бишкек',ok:1},{n:'Нурлан',r:4.7,c:18,car:'Mercedes Actros',t:28,body:'Реф',city:'Ош',ok:1},{n:'Руслан',r:4.5,c:9,car:'Sprinter',t:2,body:'Фургон',city:'Алматы',ok:0}];
const S={step:U?(U.role?'app':'role'):'phone',view:'home',tab:'cargo',from:'',to:'',phone:''};
const G={};
const hav=(p,q)=>{const r=x=>x*Math.PI/180,d=Math.acos(Math.min(1,Math.sin(r(p[0]))*Math.sin(r(q[0]))+Math.cos(r(p[0]))*Math.cos(r(q[0]))*Math.cos(r(q[1]-p[1]))));return Math.round(6371*d*1.3)};
async function geo(n){const k=n.trim().toLowerCase();if(!k)return null;if(G[k])return G[k];if(CITY[k])return G[k]=CITY[k];
 try{const d=await(await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(n))).json();if(d[0])return G[k]=[+d[0].lat,+d[0].lon]}catch(e){}return null}
async function route(A,B){try{const x=(await(await fetch(`https://router.project-osrm.org/route/v1/driving/${A[1]},${A[0]};${B[1]},${B[0]}?overview=simplified&geometries=geojson`)).json()).routes[0];return{km:Math.round(x.distance/1000),g:x.geometry}}catch(e){return{km:hav(A,B),g:null}}}
const ago=m=>m<1?'только что':m<60?m+' мин назад':Math.round(m/60)+' ч назад';
const money=p=>p?(+p).toLocaleString('ru')+' сом':'Договорная';
const kmOf=c=>c.km||(CITY[c.a.toLowerCase()]&&CITY[c.b.toLowerCase()]?hav(CITY[c.a.toLowerCase()],CITY[c.b.toLowerCase()]):null);

function auth(){
 if(S.step==='phone')return `<div class="auth"><div class="logo" style="width:56px;height:56px;font-size:20px;margin-bottom:18px">ЖЭ</div><h1 style="margin:0 0 6px">ЖҮК ЭКСПРЕСС</h1><p style="color:var(--mut);margin:0 0 22px">Грузовая платформа СНГ. Войдите по номеру телефона.</p><input class="in" id="ph" type="tel" placeholder="+996 ___ ___ ___" value="${esc(S.phone)}"><button class="btn" id="sendcode">Получить код</button></div>`;
 if(S.step==='code')return `<div class="auth"><h2 style="margin:0 0 6px">Введите код</h2><p style="color:var(--mut);margin:0 0 20px">Тестовый режим: код 1234. Настоящие SMS подключим позже.</p><input class="in" id="cd" inputmode="numeric" maxlength="4" placeholder="1234"><button class="btn" id="chk">Войти</button><button class="btn o" id="back" style="margin-top:8px">Изменить номер</button></div>`;
 return `<div class="auth"><h2 style="margin:0 0 6px">Кто вы?</h2><p style="color:var(--mut);margin:0 0 18px">Роль можно сменить позже в профиле.</p>${Object.entries(ROLES).map(([k,v])=>`<button class="role" data-role="${k}"><span style="font-size:28px">${v[0]}</span><span>${v[1]}<small>${v[2]}</small></span></button>`).join('')}</div>`}

const nav=()=>{const t=(k,i,l)=>`<button class="${S.view===k?'on':''}" data-v="${k}"><b>${i}</b>${l}</button>`;return `<nav class="nav">${t('home','⌂','Главная')}${t('garage','🚛','Гараж')}<button class="ai" id="ai">ИИ</button>${t('chats','💬','Чаты')}${t('me','👤','Профиль')}</nav>`};
const hdr=t=>`<div class="hero"><div class="brand" style="margin:0"><div class="logo">ЖЭ</div><b style="font-size:20px">${t}</b></div></div>`;
function filtered(){const f=S.from.trim().toLowerCase(),t=S.to.trim().toLowerCase();return CARGO.filter(c=>(!f||c.a.toLowerCase().includes(f))&&(!t||c.b.toLowerCase().includes(t)))}
const cargoCard=c=>{const k=kmOf(c);return `<button class="card" data-c="${c.id}"><div class="row"><span>${c.hot?'<span class="tag">Срочно</span>':''}</span><span class="price">${money(c.price)}</span></div><div class="route">${esc(c.a)}<i>→</i>${esc(c.b)}</div><div class="meta"><span>${k?'~'+k+' км':'км в деталях'}</span><span>${esc(c.t)} т</span><span>${esc(c.body)}</span><span style="margin-left:auto">${ago(c.ago)}</span></div></button>`};
const carCard=c=>`<div class="card"><div class="row" style="justify-content:flex-start;gap:14px"><div class="av">${esc(c.n[0])}</div><div><b style="font-size:18px">${esc(c.n)}</b> ${c.ok?'<span class="tag b">✓ Проверен</span>':''}<div style="font-weight:800;color:#b7791f">★ ${c.r} <span style="color:var(--mut);font-weight:500">(${c.c})</span></div><div style="color:var(--mut);font-size:14px">${esc(c.car)} · ${c.t} т · ${esc(c.body)} · ${esc(c.city)}</div></div></div></div>`;
function render(){
 if(S.step!=='app'){$('#app').innerHTML=auth();return}
 let h='';
 if(S.view==='home'){const L=S.tab==='cargo'?filtered():CARS;
  h=`<div class="hero"><div class="brand"><div class="logo">ЖЭ</div><div><b>ЖҮК ЭКСПРЕСС</b><span>Грузовая платформа СНГ</span></div></div><div class="tabs"><button class="${S.tab==='cargo'?'on':''}" data-tab="cargo">Грузы</button><button class="${S.tab==='car'?'on':''}" data-tab="car">Транспорт</button></div></div>
  <div class="box"><input class="in" id="f" placeholder="Откуда (например, Бишкек)" value="${esc(S.from)}"><input class="in" id="t" placeholder="Куда (например, Ош)" value="${esc(S.to)}" style="margin:0"></div>
  <div class="head"><span>${S.tab==='cargo'?'Грузов':'Машин'}: ${L.length}</span>${S.tab==='cargo'?'<button class="chip" id="add">+ Разместить груз</button>':''}</div><div class="list">${L.length?L.map(c=>S.tab==='cargo'?cargoCard(c):carCard(c)).join(''):'<div class="empty">Ничего не найдено.<br>Проверьте названия городов.</div>'}</div>`}
 if(S.view==='garage')h=hdr('Гараж')+`<div class="list" style="margin-top:12px">${U.cars&&U.cars.length?U.cars.map(carCard).join(''):'<div class="empty">В гараже пока пусто.<br>Добавьте машину, чтобы получать грузы.</div>'}<button class="btn" id="addcar">+ Добавить транспорт</button></div>`;
 if(S.view==='chats'){const ids=Object.keys(CHATS);h=hdr('Чаты')+`<div class="list" style="margin-top:12px">${ids.length?ids.map(id=>{const c=CARGO.find(x=>x.id==id),m=CHATS[id].slice(-1)[0];return `<button class="card" data-chat="${id}"><b>${c?esc(c.a)+' → '+esc(c.b):'Груз'}</b><div style="color:var(--mut);margin-top:4px">${esc(m?m.t:'')}</div></button>`}).join(''):'<div class="empty">Чатов пока нет.<br>Откройте груз и нажмите «Чат».</div>'}</div>`}
 if(S.view==='me')h=hdr('Профиль')+`<div class="box"><div class="row" style="justify-content:flex-start;gap:14px;margin-bottom:12px"><label class="av" style="width:72px;height:72px;cursor:pointer">${U.photo?`<img src="${U.photo}" alt="">`:'📷'}<input type="file" accept="image/*" id="pic" hidden></label><div><b style="font-size:19px">${esc(U.name||'Без имени')}</b><div style="color:var(--mut)">${esc(U.phone)}</div><span class="tag b">${ROLES[U.role][1]}</span> ${U.role==='driver'?'<span class="tag">'+(U.ok?'✓ Проверен':'Ожидает проверки')+'</span>':''}</div></div>
 ${U.role==='driver'?`<div style="font-weight:800;color:#b7791f;margin-bottom:10px">★ ${U.rating||'5.0'} <span style="color:var(--mut);font-weight:500">(${U.votes||0} отзывов)</span></div>`:''}
 <input class="in" id="nm" placeholder="Имя и фамилия" value="${esc(U.name||'')}"><button class="btn" id="savep">Сохранить</button></div>
 <div class="box"><b>Сменить роль</b><div style="margin-top:10px">${Object.entries(ROLES).map(([k,v])=>`<button class="role ${U.role===k?'on':''}" data-role2="${k}" style="padding:12px">${v[0]} ${v[1]}</button>`).join('')}</div></div>
 <div class="box"><a href="https://t.me/" style="text-decoration:none;color:inherit"><b>Техподдержка</b><div style="color:var(--mut)">Написать в Telegram</div></a><button class="btn o" id="out" style="margin-top:10px">Выйти</button></div>`;
 $('#app').innerHTML=h+nav();
}

const open=h=>{$('#sheet').innerHTML=h;$('#sheet').classList.add('on');$('#dim').classList.add('on')},close=()=>{$('#sheet').classList.remove('on');$('#dim').classList.remove('on')};$('#dim').onclick=close;
function addSheet(){
 open(`<h2>Разместить груз</h2><input class="in" id="a" placeholder="Откуда (напишите город)"><input class="in" id="b" placeholder="Куда (напишите город)"><div id="kmv" style="font-weight:800;color:var(--sky);margin:0 0 10px">Расстояние посчитается само</div>
 <input class="in" id="g" placeholder="Груз (например, ТНП)"><input class="in" id="w" type="number" placeholder="Вес, т"><select class="in" id="bd"><option>Тент</option><option>Реф</option><option>Фургон</option><option>Борт</option></select><input class="in" id="p" type="number" placeholder="Цена, сом (пусто = договорная)"><button class="btn" id="ok">Опубликовать</button>`);
 let km=0;const calc=async()=>{const a=$('#a').value,b=$('#b').value;if(!a||!b)return;$('#kmv').textContent='Считаю расстояние…';const A=await geo(a),B=await geo(b);if(!A||!B){$('#kmv').textContent='Город не найден, проверьте название';km=0;return}const r=await route(A,B);km=r.km;$('#kmv').textContent='Расстояние по дорогам: '+km+' км'};
 $('#a').onchange=calc;$('#b').onchange=calc;
 $('#ok').onclick=async()=>{const a=$('#a').value.trim(),b=$('#b').value.trim();if(!a||!b)return alert('Напишите города');if(!km)await calc();CARGO.unshift({id:Date.now(),a,b,km,t:+$('#w').value||1,body:$('#bd').value,goods:$('#g').value||'Груз',price:+$('#p').value||0,ago:0,hot:1});save('cargo',CARGO);close();render()};
}
function carSheet(){open(`<h2>Добавить транспорт</h2><input class="in" id="m" placeholder="Марка (Volvo FH)"><input class="in" id="w" type="number" placeholder="Грузоподъёмность, т"><select class="in" id="bd"><option>Тент</option><option>Реф</option><option>Фургон</option><option>Борт</option></select><input class="in" id="ct" placeholder="Где сейчас (город)"><button class="btn" id="ok">Сохранить</button>`);
 $('#ok').onclick=()=>{U.cars=(U.cars||[]).concat({n:U.name||'Я',r:5,c:0,car:$('#m').value||'Машина',t:+$('#w').value||1,body:$('#bd').value,city:$('#ct').value||'—',ok:U.ok});save('u',U);close();render()}}
async function detail(id){
 const c=CARGO.find(x=>x.id==id);if(!c)return;
 open(`<h2>${esc(c.a)} → ${esc(c.b)}</h2><div id="map"></div><p id="dist" style="font-weight:800;margin:0 0 10px">Считаю маршрут…</p><div class="kv"><div><span>Груз</span><b>${esc(c.goods)}</b></div><div><span>Вес</span><b>${esc(c.t)} т</b></div><div><span>Кузов</span><b>${esc(c.body)}</b></div><div><span>Цена</span><b>${money(c.price)}</b></div></div>
 <div class="btns"><a style="background:#0ea5e9" href="tel:+996000000000">Позвонить</a><a style="background:#1ea952" href="https://wa.me/996000000000">WhatsApp</a><a style="background:#229ed9" href="https://t.me/">Telegram</a><button style="background:var(--ink)" data-chat="${c.id}">Чат</button></div>`);
 const A=await geo(c.a),B=await geo(c.b);if(!A||!B){$('#dist').textContent='Не удалось найти город на карте';return}
 const m=L.map('map').fitBounds([A,B],{padding:[30,30]});L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(m);L.marker(A).addTo(m);L.marker(B).addTo(m);
 const r=await route(A,B);c.km=r.km;$('#dist').textContent='Расстояние по дорогам: '+r.km+' км';
 if(r.g){const p=L.geoJSON(r.g,{style:{color:'#0ea5e9',weight:5}}).addTo(m);m.fitBounds(p.getBounds(),{padding:[20,20]})}else L.polyline([A,B],{color:'#0ea5e9',dashArray:'6 8'}).addTo(m)}
function chatSheet(id){
 const c=CARGO.find(x=>x.id==id),draw=()=>($('#cl').innerHTML=(CHATS[id]||[]).map(m=>`<div class="msg ${m.me?'me':''}">${esc(m.t)}</div>`).join('')||'<div class="empty">Напишите первое сообщение</div>');
 open(`<h2>Чат: ${c?esc(c.a)+' → '+esc(c.b):''}</h2><div id="cl"></div><div style="display:flex;gap:8px"><input class="in" id="tx" placeholder="Сообщение" style="margin:0"><button class="btn" id="snd" style="width:auto;padding:0 18px">➤</button></div><p style="color:var(--mut);font-size:12px">Тест: сообщения хранятся на этом телефоне. Настоящий чат между людьми подключим вместе с сервером.</p>`);draw();
 const send=()=>{const v=$('#tx').value.trim();if(!v)return;(CHATS[id]=CHATS[id]||[]).push({me:1,t:v});save('chats',CHATS);$('#tx').value='';draw()};$('#snd').onclick=send;$('#tx').onkeydown=e=>e.key==='Enter'&&send()}
function aiSheet(){
 open(`<h2>ИИ-ассистент</h2><div id="cl"><div class="msg">Напишите, какой груз ищете. Например: «Бишкек Ош тент 20 т».</div></div><div style="display:flex;gap:8px"><input class="in" id="tx" placeholder="Ваш запрос" style="margin:0"><button class="btn" id="snd" style="width:auto;padding:0 18px">➤</button></div>`);
 const send=()=>{const v=$('#tx').value.trim().toLowerCase();if(!v)return;$('#cl').insertAdjacentHTML('beforeend',`<div class="msg me">${esc(v)}</div>`);$('#tx').value='';
  const f=Object.keys(CITY).filter(c=>v.includes(c.slice(0,4))).sort((x,y)=>v.indexOf(x.slice(0,4))-v.indexOf(y.slice(0,4))),w=(v.match(/(\d+)\s*т/)||[])[1],bd=v.includes('реф')?'Реф':v.includes('тент')?'Тент':'';
  const r=CARGO.filter(c=>(!f[0]||c.a.toLowerCase().startsWith(f[0].slice(0,4)))&&(!f[1]||c.b.toLowerCase().startsWith(f[1].slice(0,4)))&&(!bd||c.body===bd)&&(!w||c.t>=+w));
  $('#cl').insertAdjacentHTML('beforeend',`<div class="msg">Нашёл грузов: ${r.length}.<br>${r.map(c=>esc(c.a)+' → '+esc(c.b)+', '+c.t+' т, '+esc(c.body)).join('<br>')}</div>`)};
 $('#snd').onclick=send;$('#tx').onkeydown=e=>e.key==='Enter'&&send()}

document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(b.id==='sendcode'){S.phone=$('#ph').value.trim();if(S.phone.length<9)return alert('Введите номер телефона');S.step='code';render()}
 else if(b.id==='back'){S.step='phone';render()}
 else if(b.id==='chk'){if($('#cd').value!=='1234')return alert('Неверный код. Для теста: 1234');const o=J('u',null);U=o&&o.phone===S.phone?o:{phone:S.phone};save('u',U);S.step=U.role?'app':'role';render()}
 else if(d.role){U.role=d.role;save('u',U);S.step='app';render()}
 else if(d.role2){U.role=d.role2;save('u',U);render()}
 else if(d.tab){S.tab=d.tab;render()}
 else if(d.v){S.view=d.v;render()}
 else if(d.c)detail(d.c);
 else if(d.chat)chatSheet(d.chat);
 else if(b.id==='add')addSheet();else if(b.id==='addcar')carSheet();else if(b.id==='ai')aiSheet();
 else if(b.id==='savep'){U.name=$('#nm').value.trim();save('u',U);render()}
 else if(b.id==='out'){U=null;localStorage.removeItem('u');S.step='phone';render()}
});
document.addEventListener('input',e=>{if(e.target.id==='f'||e.target.id==='t'){S.from=$('#f').value;S.to=$('#t').value;const p=e.target.selectionStart,id=e.target.id;render();const n=$('#'+id);n.focus();n.setSelectionRange(p,p)}});
document.addEventListener('change',e=>{if(e.target.id==='pic'&&e.target.files[0]){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d'),s=Math.min(i.width,i.height);x.drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,160,160);U.photo=c.toDataURL('image/jpeg',.8);save('u',U);render()};i.src=r.result};r.readAsDataURL(e.target.files[0])}});
render();
</script></body></html>
