function home(){const a=flt();return `<div class="bar"><div class="logo">${ic('mine')}</div><h1>ЖҮК ЭКСПРЕСС</h1></div><div class="hero"><p>${t('tag')}</p><div><b>${LD.length}</b><span>${t('stL')}</span></div><div><b>${CR.length}</b><span>${t('stC')}</span></div></div>${seg('tab',S.tab,[['loads',t('loads')],['cars',t('cars')]])}<div class="pad"><input class="in" id="q" type="search" placeholder="${t('q')}" value="${esc(S.q)}" autocomplete="off"></div><div class="chips">${['',...BODIES].map(b=>`<button class="${S.body===b?'on':''}" data-a="body" data-v="${b}">${b||t('all')}</button>`).join('')}</div><div class="pad row" style="margin-bottom:8px;color:var(--mut);font-weight:700"><span>${t('found')}: <span id="cnt">${a.length}</span></span>${S.tab==='loads'?`<select class="sort" id="so" aria-label="sort">${[['new','sNew'],['cheap','sCheap'],['short','sShort']].map(([k,l])=>`<option value="${k}" ${S.sort===k?'selected':''}>${t(l)}</option>`).join('')}</select>`:''}</div><div class="list" id="list">${listH(a)}</div>`}
function mine(){const isL=S.mine==='loads',a=(isL?LD:CR).filter(x=>x.by===U.id);
return `<div class="bar"><h1>${t('mine')}</h1></div>${seg('mt',S.mine,[['loads',t('ml')],['cars',t('mc')]])}<div class="list">${a.length?a.map(x=>`<div>${x.a?lcard(x):ccard(x)}<button class="btn o d" style="margin-top:6px" data-a="del" data-id="${x.id}">${t('rm')}</button></div>`).join(''):`<div class="empty">${t('none')}</div>`}<button class="btn" data-a="${isL?'addL':'addC'}">+ ${t(isL?'addL':'addC')}</button></div>`}
const favs=()=>`<div class="bar"><h1>${t('fav')}</h1></div><div class="list">${listH([...LD,...CR].filter(x=>F.includes(x.id)))}</div>`;
function me(){const o=(k,v,l)=>`<option value="${k}" ${v===k?'selected':''}>${l}</option>`;
return `<div class="bar"><h1>${t('me')}</h1></div><div class="pad"><div class="grp"><div style="justify-content:flex-start;gap:14px"><label class="av" style="cursor:pointer;width:72px;height:72px">${U.photo?`<img src="${esc(U.photo)}" alt="">`:'📷'}<input id="pic" type="file" accept="image/*" hidden></label><div style="flex:1;min-width:0"><input class="in" id="nm" placeholder="${t('name')}" value="${esc(U.name||'')}" style="margin:0 0 4px"><span>${esc(U.phone||(U.tg?'@'+U.tg:''))}</span></div></div></div>
<div class="grp"><div><span>${t('role')}</span><select id="rl">${['driver','owner','disp'].map(r=>o(r,U.role,t(r))).join('')}</select></div><div><span>${t('lang')}</span><select id="lg">${o('ru',ST.lang,'Русский')+o('ky',ST.lang,'Кыргызча')}</select></div><div><span>${t('cur')}</span><select id="cu">${Object.keys(CUR).map(k=>o(k,ST.cur,k+' '+CUR[k][0])).join('')}</select></div><div><span>${t('theme')}</span><select id="th">${['auto','light','dark'].map(k=>o(k,ST.theme,t(k))).join('')}</select></div><div><span>${t('notif')}</span><button class="sw ${ST.notif?'on':''}" data-a="notif" role="switch" aria-checked="${ST.notif}" aria-label="${t('notif')}"></button></div></div>
<div class="grp"><div><span>${t('ml')}</span><b>${LD.filter(x=>x.by===U.id).length}</b></div><div><span>${t('mc')}</span><b>${CR.filter(x=>x.by===U.id).length}</b></div><div><span>${t('fav')}</span><b>${F.length}</b></div></div>
<div class="grp"><div data-a="help" style="cursor:pointer"><b>${t('help')}</b><span>›</span></div><div><span>${t('about')}</span><span>v${CFG.ver}</span></div></div>
<button class="btn o" data-a="out">${t('out')}</button><button class="btn o d" style="margin-top:8px" data-a="delacc">${t('del')}</button></div>`}
const nav=()=>{const b=v=>`<button class="${S.view===v?'on':''}" data-a="v" data-v="${v}"><b>${ic(v)}</b>${t(v)}</button>`;return `<nav class="nav">${b('home')}${b('mine')}<button class="plus" data-a="plus" aria-label="+">${ic('plus',28)}</button>${b('fav')}${b('me')}</nav>`};
const langSel=`<select class="in" id="lg" style="width:auto;margin:0">${[['ru','RU'],['ky','KY']].map(([k,l])=>`<option value="${k}" ${ST.lang===k?'selected':''}>${l}</option>`).join('')}</select>`;
function auth(){if(S.step==='phone')return `<div class="auth"><div class="row" style="margin-bottom:18px"><div class="logo">${ic('mine')}</div>${langSel}</div><h1>ЖҮК ЭКСПРЕСС.KG</h1><p style="color:var(--mut)">${t('login')}</p><input class="in" id="ph" type="tel" placeholder="+996 ___ ___ ___" value="${esc(S.ph)}"><button class="btn" data-a="sendcode">${t('code')}</button></div>`;
if(S.step==='code')return `<div class="auth"><h2>${t('code')}</h2><p style="color:var(--mut)">${t('demo')}</p><input class="in" id="cd" inputmode="numeric" maxlength="4" placeholder="1234"><button class="btn" data-a="chk">${t('enter')}</button></div>`;
return `<div class="auth"><h2>${t('who')}</h2>${[['driver','🚛'],['owner','📦'],['disp','🧭']].map(([r,i])=>`<button class="role" data-a="role" data-v="${r}"><span style="font-size:28px">${i}</span>${t(r)}</button>`).join('')}</div>`}
function render(){theme();document.documentElement.lang=ST.lang;$('#app').innerHTML=S.step!=='app'?auth():({home,mine,fav:favs,me})[S.view]()+nav()}
const openS=h=>{$('#sheet').innerHTML=h;$('#sheet').classList.add('on');$('#dim').classList.add('on')},closeS=()=>{$('#sheet').classList.remove('on');$('#dim').classList.remove('on')};$('#dim').onclick=closeS;
function toast(m){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),2400)}
const contact=c=>{const p=ph(c.phone);return `<div class="btns">${p?`<a class="btn" href="tel:${p}">${t('call')}</a><a class="btn o" href="https://wa.me/${p.replace('+','')}" target="_blank" rel="noopener">WhatsApp</a>`:''}${c.tg?`<a class="btn o" href="https://t.me/${encodeURIComponent(c.tg)}" target="_blank" rel="noopener">Telegram</a>`:''}</div>`},
row=(k,v)=>`<div><span>${k}</span><b>${v}</b></div>`;
let tok=0;
async function detail(id){const c=LD.find(x=>x.id===id);if(!c)return;const my=++tok;
openS(`${rt(c.a,c.b,km(c))}<div id="map"></div><p id="dist" style="font-weight:800;margin:0 0 10px">${t('calc')}</p><div class="kv">${row(t('goods'),esc(c.goods))+row(t('wt'),esc(c.t))+row(t('body'),esc(c.body))+row(t('price'),money(c.price))+(c.d?row(t('date'),esc(c.d)):'')}${c.note?`<div style="display:block"><span>${t('note')}</span><p style="margin:6px 0">${esc(c.note)}</p></div>`:''}</div>${contact(c)}<button class="btn o" style="margin-top:8px" data-a="share" data-id="${c.id}">${t('share')}</button>`);
const A=await geo(c.a),B=await geo(c.b);if(my!==tok)return;if(!A||!B){$('#dist').textContent=t('nocity');return}
const r=await route(A,B);if(my!==tok)return;$('#dist').textContent=t('route')+': '+r.km+' км';if(!window.L)return;
setTimeout(()=>{if(my!==tok||!$('#map'))return;const m=L.map('map').fitBounds([A,B],{padding:[30,30]});L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(m);L.marker(A).addTo(m);L.marker(B).addTo(m);if(r.g){const p=L.geoJSON(r.g,{style:{color:'#d4a800',weight:5}}).addTo(m);m.fitBounds(p.getBounds(),{padding:[20,20]})}},60)}
function carD(id){const c=CR.find(x=>x.id===id);if(!c)return;tok++;openS(`<h2>${esc(c.n)}</h2><div class="kv">${row(t('cars'),esc(c.car))+row(t('wt'),esc(c.t))+row(t('body'),esc(c.body))+row(t('city'),esc(c.city))}</div>${contact(c)}`)}
const opts=a=>a.map(b=>`<option>${b}</option>`).join(''),cp=()=>`<input class="in" id="cp" type="tel" placeholder="${t('phone')}" value="${esc(U.phone||'')}">`;
function addLoad(){openS(`<h2>${t('addL')}</h2>${DL}<input class="in" id="a" list="ct" placeholder="${t('from')}"><input class="in" id="b" list="ct" placeholder="${t('to')}"><div id="kmv" style="font-weight:800;margin-bottom:10px"></div><input class="in" id="g" placeholder="${t('goods')}"><input class="in" id="w" type="number" min="0" step="any" placeholder="${t('wt')}"><select class="in" id="bd">${opts(BODIES)}</select><input class="in" id="p" type="number" min="0" placeholder="${t('price')}, ${CUR[ST.cur][0]}"><input class="in" id="dt" type="date">${cp()}<textarea class="in" id="ex" placeholder="${t('note')}"></textarea><button class="btn" data-a="pubL">${t('pub')}</button>`)}
async function pubL(btn){const a=g('a'),b=g('b'),p=g('cp'),w=+g('w');if(!a||!b||!okPh(p)||!(w>0))return toast(t('fill'));
btn.disabled=true;let k=0;try{const A=await geo(a),B=await geo(b);if(A&&B)k=(await route(A,B)).km}catch{}
LD.unshift({id:'u'+Date.now(),a,b,km:k,t:w,body:g('bd'),goods:g('g')||'—',price:Math.round((+g('p')||0)/CUR[ST.cur][1]),d:g('dt'),phone:p,tg:(U.tg||'').replace(/\W/g,''),note:g('ex'),ts:Date.now(),hot:0,by:U.id});
if(!LS.s('LD',LD)){LD.shift();btn.disabled=false;return}U.phone=U.phone||p;LS.s('U',U);closeS();Object.assign(S,{view:'home',tab:'loads',q:'',body:''});render();toast(t('ok'))}
function addCar(){openS(`<h2>${t('addC')}</h2>${DL}<input class="in" id="m" placeholder="Volvo FH"><input class="in" id="w" type="number" min="0" step="any" placeholder="${t('wt')}"><select class="in" id="bd">${opts(BODIES)}</select><input class="in" id="ct2" list="ct" placeholder="${t('city')}">${cp()}<button class="btn" data-a="pubC">${t('pub')}</button>`)}
function pubC(){const p=g('cp'),w=+g('w');if(!g('m')||!g('ct2')||!okPh(p)||!(w>0))return toast(t('fill'));
CR.unshift({id:'u'+Date.now(),n:U.name||'—',r:0,k:0,car:g('m'),t:w,body:g('bd'),city:g('ct2'),phone:p,tg:(U.tg||'').replace(/\W/g,''),photo:U.photo||'',ts:Date.now(),by:U.id});
if(!LS.s('CR',CR)){CR.shift();return}U.phone=U.phone||p;LS.s('U',U);closeS();Object.assign(S,{view:'home',tab:'cars',q:'',body:''});render();toast(t('ok'))}
const help=()=>openS(`<h2>${t('help')}</h2><div class="btns" style="grid-template-columns:1fr"><a class="btn" href="${esc(CFG.tg)}" target="_blank" rel="noopener">Telegram</a><a class="btn o" href="https://wa.me/${CFG.wa.replace('+','')}" target="_blank" rel="noopener">WhatsApp</a><a class="btn o" href="tel:${CFG.tel}">${t('call')}</a></div>`);
const save=()=>{LS.s('LD',LD);LS.s('CR',CR);LS.s('F',F)};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el)return;const{a,id,v:val}=el.dataset;
const H={
sendcode(){S.ph=g('ph');if(!okPh(S.ph))return toast(t('fill'));S.step='code';render()},
chk(){if(g('cd')!=='1234')return toast('✗');const o=LS.g('U',null),p=ph(S.ph);U=o&&o.phone===p?o:{id:p,phone:p,name:''};LS.s('U',U);S.step=U.role?'app':'role';render()},
role(){U.role=val;LS.s('U',U);S.step='app';render()},
tab(){S.tab=val;S.body='';render()},body(){S.body=val;render()},mt(){S.mine=val;render()},
v(){S.view=val;render();scrollTo(0,0)},load(){detail(id)},car(){carD(id)},
fav(){F=F.includes(id)?F.filter(x=>x!==id):[...F,id];LS.s('F',F);render()},
plus(){openS(`<button class="btn" data-a="addL" style="margin-bottom:10px">📦 ${t('addL')}</button><button class="btn o" data-a="addC">🚛 ${t('addC')}</button>`)},
addL:addLoad,addC:addCar,pubL(){pubL(el)},pubC,help,
share(){const c=LD.find(x=>x.id===id);if(!c)return;const tx=`${c.a} → ${c.b}, ${c.t} т, ${c.body}, ${money(c.price)}`,u=location.href.split('#')[0];if(navigator.share)navigator.share({title:'ЖҮК ЭКСПРЕСС',text:tx,url:u}).catch(()=>{});else navigator.clipboard?.writeText(tx+' '+u).then(()=>toast(t('copied')))},
del(){if(!confirm(t('rm')+'?'))return;LD=LD.filter(x=>x.id!==id);CR=CR.filter(x=>x.id!==id);F=F.filter(x=>x!==id);save();render()},
notif(){ST.notif=!ST.notif;LS.s('st',ST);render()},
out(){U=null;localStorage.removeItem('jx.U');Object.assign(S,{step:'phone',view:'home'});render()},
delacc(){if(confirm(t('sure'))){Object.keys(localStorage).filter(k=>k.startsWith('jx.')).forEach(k=>localStorage.removeItem(k));location.reload()}}};
H[a]?.()});
document.addEventListener('change',ev=>{const T=ev.target,i=T.id,v=T.value;
if(i==='lg'){ST.lang=v;LS.s('st',ST);render()}
else if(i==='cu'||i==='th'){ST[i==='cu'?'cur':'theme']=v;LS.s('st',ST);render()}
else if(i==='rl'){U.role=v;LS.s('U',U);toast(t('ok'))}
else if(i==='nm'){U.name=v.trim();LS.s('U',U)}
else if(i==='pic'&&T.files[0]){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,160,160);U.photo=c.toDataURL('image/jpeg',.8);LS.s('U',U);render()};im.src=r.result};r.readAsDataURL(T.files[0])}
else if(i==='so'){S.sort=v;$('#list').innerHTML=listH(flt())}
else if(i==='a'||i==='b'){const a=g('a'),b=g('b'),o=$('#kmv');if(a&&b){o.textContent=t('calc');Promise.all([geo(a),geo(b)]).then(async([A,B])=>{o.textContent=A&&B?t('route')+': '+(await route(A,B)).km+' км':t('nocity')})}}});
document.addEventListener('input',ev=>{if(ev.target.id==='q'){S.q=ev.target.value;const a=flt();$('#list').innerHTML=listH(a);$('#cnt').textContent=a.length}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeS();if(ev.key==='Enter'&&ev.target.matches('.card'))ev.target.click()});
render();
</script></body></html>
